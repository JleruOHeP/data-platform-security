<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Category Levels Circle</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px;
    }
    #chart {
      margin-top: 20px;
    }
    #description {
      margin-top: 20px;
      max-width: 400px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f9f9f9;
    }
    svg text {
      font-size: 12px;
      fill: #333;
    }
  </style>
</head>
<body>
  <h1>Category Levels Circle</h1>
  <input type="file" id="fileInput" />
  <div id="chart"></div>
  <div id="description">Click a segment to see its description. Double-click to toggle completion.</div>

  <script>
    const width = 700;
    const radius = width / 2;

    const svg = d3.select("#chart")
      .append("svg")
      .attr("width", width)
      .attr("height", width)
      .append("g")
      .attr("transform", `translate(${radius},${radius})`);

    // striped pattern
    const defs = d3.select("svg").append("defs");
    defs.append("pattern")
      .attr("id", "stripes")
      .attr("patternUnits", "userSpaceOnUse")
      .attr("width", 6)
      .attr("height", 6)
      .append("path")
      .attr("d", "M0,0 l6,6 M-1,1 l2,-2 M5,7 l2,-2")
      .attr("stroke", "#0F0")
      .attr("stroke-width", 2);

    const color = d3.scaleOrdinal(d3.schemeCategory10);

    // completed parts
    const completedSet = new Set();

    document.getElementById("fileInput").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = JSON.parse(evt.target.result);
        draw(data);
      };
      reader.readAsText(file);
    });

    function draw(data) {
      svg.selectAll("*").remove(); // clear old

      const categories = data.categories;

      // find max level across all categories
      const maxLevels = d3.max(
        categories.flatMap(c => c.levels.map(l => l.level))
      );

      const arc = d3.arc();
      const pie = d3.pie().value(1).sort(null);
      const categoryArcs = pie(categories);

      categoryArcs.forEach((cat, i) => {
        const angle = cat.endAngle - cat.startAngle;
        const startAngle = cat.startAngle;

        const ringThickness = radius / (maxLevels + 1);

        // map: levelNum -> parts[]
        const levelMap = new Map(cat.data.levels.map(l => [l.level, l.parts]));

        for (let j = 1; j <= maxLevels; j++) {
          const innerR = (j - 1) * ringThickness;
          const outerR = j * ringThickness;

          const parts = levelMap.get(j); // array or undefined
          if (!parts) {
            // render empty band
            svg.append("path")
              .attr("d", arc({
                innerRadius: innerR,
                outerRadius: outerR,
                startAngle: startAngle,
                endAngle: startAngle + angle
              }))
              .attr("fill", "#f0f0f0")
              .attr("stroke", "#fff");
          } else {
            // divide angular span among parts
            const partAngle = angle / parts.length;
            parts.forEach((part, pIndex) => {
              const partStart = startAngle + pIndex * partAngle;
              const partEnd = partStart + partAngle;
              const key = `${cat.data.name}-${j}-${pIndex}`;

              svg.append("path")
                .attr("d", arc({
                  innerRadius: innerR,
                  outerRadius: outerR,
                  startAngle: partStart,
                  endAngle: partEnd
                }))
                .attr("fill", () => {
                  if (completedSet.has(key)) return "url(#stripes)";
                  return color(i);
                })
                .attr("stroke", "#fff")
                .style("cursor", "pointer")
                .on("click", () => {
                  d3.select("#description").text(`${cat.data.name} L${j} - ${part}`);
                })
                .on("dblclick", function() {
                  if (completedSet.has(key)) {
                    completedSet.delete(key);
                  } else {
                    completedSet.add(key);
                  }
                  d3.select(this).attr("fill", completedSet.has(key) ? "url(#stripes)" : color(i));
                });
            });
          }

          // add category label on outermost ring
          if (j === maxLevels) {
            const [x, y] = arc.centroid({
              innerRadius: outerR,
              outerRadius: outerR + 50,
              startAngle: startAngle,
              endAngle: startAngle + angle
            });
            svg.append("text")
              .attr("x", x)
              .attr("y", y)
              .attr("text-anchor", "middle")
              .text(cat.data.name);
          }
        }
      });
    }
  </script>
</body>
</html>
